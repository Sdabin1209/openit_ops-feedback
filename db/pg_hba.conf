# ops-feedback-db 접속 규칙(ADR 0035). trust 줄이 없다(루프백 포함). 위에서 아래로 처음 맞는 줄이 적용된다.
# 컨테이너 안 OS 사용자 postgres 의 소켓 접속만 peer(초기화·상태 확인). 그 밖의 소켓 접속은 거부한다.
local   all   postgres                 peer
local   all   all                      reject
# 네트워크 접속은 TLS 필수(hostssl)와 scram-sha-256 암호 확인뿐이다. TLS 없는 접속은 거부한다.
hostssl all   all        0.0.0.0/0     scram-sha-256
hostssl all   all        ::/0          scram-sha-256
hostnossl all all        all           reject
