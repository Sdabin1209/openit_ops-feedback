# 예시 설정. 값은 시험과 시연용이며 사용자가 정한 기준이 아니다.
# 비식별 기준(deid), 보관 기간(retention), 분류체계(classification), 롤백 기준(rollback)은 사용자 결정 사항이다.
storage:
  log_db: data/log.db          # 로그 저장소(원본). 비식별 처리기만 읽는다.
  failure_db: data/failures.db # 실패 사례 저장소(비식별 뒤의 것만)

deid:
  policy_id: example-conservative-v0
  salt_env: OPS_DEID_SALT               # 의사 식별자 salt. 비밀 값은 OPS_DEID_SALT_FILE(파일 경로)로 받는다. 개발용으로 OPS_DEID_SALT도 된다.
  pseudonymize_keys: [session_id, turn_id]
  # 스키마가 열거값으로 정하지 않은 자유 문자열 중 남길 키. 구조 식별자만 둔다.
  # action은 EXTRACT_FAILED·REASK_STREAK 규칙이 읽는다(모델 출력의 문자열이라 위반 턴에서는 임의 문자열일 수 있고, 잔존 패턴 검사만 거친다).
  keep_count_map_keys: [extract_protections]   # 규칙 코드별 건수(키는 대문자 식별자 모양, 값은 0 이상 정수인 항목만). docs/adr/0013-extract-protections-counts.md
  keep_string_keys: [question_id, slot_id, repeat_key, code, path, action, next_item]
  scrub_string_keys: []                 # 패턴 치환 후 남길 키(없음)
  scrub_patterns: {}
  unlisted_string_action: mask          # mask | drop
  mask_defs: [Value]                    # 환자 답변 값(숫자 포함)은 통째로 마스킹
  drop_defs: []                         # 지목한 정의가 문진 스키마에 없으면 비식별이 실패로 닫힌다(v2 TurnTrace에는 QuestionBank가 없다)
  mask_value_keys: [value]              # 추출 출력의 values[].value는 스키마가 형태를 정하지 않아(숫자·불리언 가능) 키로 마스킹
  mask_number_keys: []
  residual_patterns:                    # 결과에 남으면 실패로 닫는 패턴
    email: '[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,255}\.[A-Za-z]{2,}'     # 길이를 묶어 입력 길이에 선형(점검 round2 M2)
    phone_kr: '0\d{1,2}[- .]?\d{3,4}[- .]?\d{4}'
    rrn_kr: '\d{6}[- ]?[1-4]\d{6}'

detection:
  detectors:
    - type: rule
      rules:
        - {id: TURN_FAILURE_SIGNAL}
        - {id: TURN_FAILED_STEPS}
        - {id: COMMIT_ERROR}
        - {id: GENERATOR_FALLBACK}          # response_outcome == fallback (옛 이름 유지)
        - {id: STAFF_ALERT_DELIVERY_FAILED}
        - {id: INTERVENTION_FAILED}
        # 값이 빈 추출은 REDIRECT만 정상이다. HOLD·SKIP도 계약상 targets(1~4개, 모두 같은 행 values의 key)가 필수라 값이 비면 계약 위반이다(ADR 0012).
        - {id: EXTRACT_FAILED}                  # params.empty_values_ok_actions 기본 [REDIRECT]
        # 반복 물음: REASK 또는 CONFIRM이 연속으로 나온 턴 수(합쳐 센다, 다른 action이 나오면 리셋)가 이번 턴 포함 3 이상이면 걸린다. survey-service의 _reask_escalation과 같은 정의다.
        # 3의 근거: survey-service는 연속 3번 뒤 4번째에 직원 호출로 넘긴다(SURVEY_MAX_CONSECUTIVE_REASK 기본 3, G12). 표준 대화 설계의 '되묻기 2~3회 뒤 사람 연결'과 head FAULT_POLICY의 3회 재시도 관행. 측정하지 않았다(docs/adr/0012-reask-streak-and-empty-values.md).
        - {id: REASK_STREAK, params: {threshold: 3, actions: [REASK, CONFIRM]}}

classification:                         # 분류체계는 미정(O11). 아래 값은 자리표시자다.
  default_failure_type: UNCLASSIFIED
  rule_to_type: {}
  priority: [TURN_FAILURE_SIGNAL, COMMIT_ERROR, TURN_FAILED_STEPS]

retention:                              # D88/U4 최소 보존 잠정 기본값(병원 규정이 다르면 숫자만 바꾼다). null은 시작 거부, 무기한은 명시적으로 "forever"(경고)
  raw_days: 30                          # 처리 끝난 원본 Trace(처리 표시가 없는 원본은 지우지 않는다)
  cases_days: 180                       # 비식별 실패 사례(모든 version)와 고아 trace
  metrics_days: 365                     # 지표 스냅샷·롤백 요청·영수증
  # failed_raw_days: 90                # 선택. 재시도 대상(DEID_FAILED, PUBLISH_FAILED) 원본의 별도 기한. 적지 않으면 raw_days를 따른다(forever면 forever). 기본값 없음, 값은 사용자 결정
  # cases_purge_confirmed: true         # 불리언만(문자열 "false"는 시작 거부). 기본 true = 잡은 확정(CONFIRMED) 사례도 cases_days 뒤 지운다. admin purge는 반대로 --include-confirmed가 있어야 지운다
  raw_after_processing: keep            # keep | minimize(처리가 끝나면 봉투 내용을 즉시 지우고 중복 판별 키·해시·시각만 남김)

# rollback 항목을 두면 롤백 평가를 한다. release_reader가 없으면 평가를 건너뛴다.
# rollback:
#   window_hours: 24
#   min_turns: 100
#   max_failure_rate: 0.05
#   counted_review_statuses: [PENDING, CONFIRMED]
#   requested_by_role: ops-feedback
#   auto_submit: false
# release_reader:                       # I4 읽기. 클라이언트가 나오면(boundary-contracts v1.2.0) 아래처럼 HTTP로 고른다.
#   factory: "boundary_contracts.clients:HttpReleaseReader"
#   args: {base_url: "http://release-gate:8080", token: {secret: OPS_GATE_READ_TOKEN}}   # {secret: 이름}(또는 {env: 이름})은 이름_FILE의 파일 내용(없으면 환경 변수 이름)으로 바뀐다
# gate_service:                         # I5 request_rollback (auto_submit일 때)
#   factory: "모듈:함수"
#   args: {base_url: "...", token: {secret: OPS_GATE_WRITE_TOKEN}}
