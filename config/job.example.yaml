# 예시 설정. 값은 시험과 시연용이며 사용자가 정한 기준이 아니다.
# 비식별 기준(deid), 보관 기간(retention), 분류체계(classification), 롤백 기준(rollback)은 사용자 결정 사항이다.
storage:
  log_db: data/log.db          # 로그 저장소(원본). 비식별 처리기만 읽는다.
  failure_db: data/failures.db # 실패 사례 저장소(비식별 뒤의 것만)

deid:
  policy_id: example-conservative-v0
  salt_env: OPS_DEID_SALT               # 의사 식별자 salt. 비밀 값은 OPS_DEID_SALT_FILE(파일 경로)로 받는다. 개발용으로 OPS_DEID_SALT도 된다.
  pseudonymize_keys: [session_id, turn_id]
  # 스키마가 열거값으로 정하지 않은 자유 문자열 중 남길 키. 구조 식별자만 둔다.
  # action·next_item은 EXTRACT_FAILED·REASK_STREAK 규칙이 읽는다(모델 출력의 문자열이라 위반 턴에서는 임의 문자열일 수 있고, 잔존 패턴 검사만 거친다).
  keep_string_keys: [question_id, slot_id, repeat_key, code, path, action, next_item]
  scrub_string_keys: []                 # 패턴 치환 후 남길 키(없음)
  scrub_patterns: {}
  unlisted_string_action: mask          # mask | drop
  mask_defs: [Value]                    # 환자 답변 값(숫자 포함)은 통째로 마스킹
  drop_defs: []                         # 지목한 정의가 문진 스키마에 없으면 비식별이 실패로 닫힌다(v2 TurnTrace에는 QuestionBank가 없다)
  mask_value_keys: [value]              # 추출 출력의 values[].value는 스키마가 형태를 정하지 않아(숫자·불리언 가능) 키로 마스킹
  mask_number_keys: []
  residual_patterns:                    # 결과에 남으면 실패로 닫는 패턴
    email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    phone_kr: '0\d{1,2}[- .]?\d{3,4}[- .]?\d{4}'
    rrn_kr: '\d{6}[- ]?[1-4]\d{6}'

detection:
  detectors:
    - type: rule
      rules:
        - {id: TURN_FAILURE_SIGNAL}
        - {id: TURN_FAILED_STEPS}
        - {id: COMMIT_ERROR}
        - {id: GENERATOR_FALLBACK}          # response_outcome == fallback (옛 이름 유지)
        - {id: STAFF_ALERT_DELIVERY_FAILED}
        - {id: INTERVENTION_FAILED}
        - {id: EXTRACT_FAILED, enabled: false}   # params.empty_values_ok_actions 기본 [REDIRECT]
        - {id: REASK_STREAK, enabled: false, params: {threshold: 3}}   # 임계값은 사용자 결정 전(자리표시자)

classification:                         # 분류체계는 미정(O11). 아래 값은 자리표시자다.
  default_failure_type: UNCLASSIFIED
  rule_to_type: {}
  priority: [TURN_FAILURE_SIGNAL, COMMIT_ERROR, TURN_FAILED_STEPS]

retention:
  raw_days: null                        # 미정(사용자 결정). null이면 원본을 지우지 않는다.

# rollback 항목을 두면 롤백 평가를 한다. release_reader가 없으면 평가를 건너뛴다.
